name: Build ProntoQuota

on:
  push:
    tags:
      - 'v*'          # Si attiva quando pubblichi un tag tipo v1.0.0
  workflow_dispatch:  # Permette di avviarlo manualmente da GitHub

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: cd electron-app && npm install

      - name: Build macOS (.app + DMG)
        run: cd electron-app && npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica artefatto Mac
        uses: actions/upload-artifact@v4
        with:
          name: ProntoQuota-Mac
          path: electron-app/dist/*.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: cd electron-app && npm install

      - name: Build Windows (.exe installer)
        run: cd electron-app && npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Carica artefatto Windows
        uses: actions/upload-artifact@v4
        with:
          name: ProntoQuota-Windows
          path: electron-app/dist/*.exe

  release:
    name: Pubblica Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Scarica artefatto Mac
        uses: actions/download-artifact@v4
        with:
          name: ProntoQuota-Mac
          path: dist-mac

      - name: Scarica artefatto Windows
        uses: actions/download-artifact@v4
        with:
          name: ProntoQuota-Windows
          path: dist-win

      - name: Crea Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ProntoQuota ${{ github.ref_name }}
          body: |
            ## 🎉 ProntoQuota ${{ github.ref_name }}
            
            ### Download
            - 🍎 **Mac** → scarica il file `.dmg`
            - 🪟 **Windows** → scarica il file `.exe`
            
            > Al primo avvio su Mac: tasto destro → Apri
          files: |
            dist-mac/*.dmg
            dist-win/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
